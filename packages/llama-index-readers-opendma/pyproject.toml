[project]
name = "llama-index-readers-opendma"
version = "0.2.0.dev1"
description = "LlamaIndex readers for OpenDMA - integrate ECM systems with LlamaIndex"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Stefan Kopf", email = "s.kopf@xaldon.de" }
]
requires-python = ">=3.10,<4"
dependencies = [
    "llama-index-core>=0.14.0,<0.15.0",
    "opendma-api>=0.8.0",
    "opendma-remote>=0.8.0",
]
keywords = ["llama-index", "opendma", "ecm", "readers", "document-management"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://opendma.org"
Repository = "https://github.com/OpenDMA/llama-index-opendma.git"
Documentation = "https://github.com/OpenDMA/llama-index-opendma/tree/main/docs"
Issues = "https://github.com/OpenDMA/llama-index-opendma/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]

[project]
name = "llama-index-retrievers-opendma"
version = "0.2.0.dev1"
description = "LlamaIndex retrievers for OpenDMA - retrieve ECM content with LlamaIndex"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Stefan Kopf", email = "s.kopf@xaldon.de" }
]
requires-python = ">=3.10,<4"
dependencies = [
    "llama-index-core>=0.14.0,<0.15.0",
    "llama-index-readers-opendma>=0.1.0.dev1",
]
keywords = ["llama-index", "opendma", "ecm", "retrievers", "document-management"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://opendma.org"
Repository = "https://github.com/OpenDMA/llama-index-opendma.git"
Documentation = "https://github.com/OpenDMA/llama-index-opendma/tree/main/docs"
Issues = "https://github.com/OpenDMA/llama-index-opendma/issues"

[dependency-groups]
dev = [
    "llama-index-embeddings-openai>=0.5.0,<0.6.0",
    "llama-index-llms-openai>=0.6.0,<0.7.0",
    "llama-index-readers-docling>=0.4.0,<0.5.0",
]

[tool.uv.sources]
llama-index-readers-opendma = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]

[project]
name = "llama-index-opendma-workspace"
version = "0.2.0.dev1"
description = "Integration of Enterprise Content Management (ECM) systems with LlamaIndex through tools, readers, and retrievers"
requires-python = ">=3.10,<4"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/llama-index-readers-opendma/src;packages/llama-index-retrievers-opendma/src;packages/llama-index-tools-opendma/src"

[tool.pytest.ini_options]
testpaths = [
    "packages/llama-index-readers-opendma/tests",
    "packages/llama-index-retrievers-opendma/tests",
    "packages/llama-index-tools-opendma/tests",
]
addopts = "--cov=llama_index.readers.opendma --cov=llama_index.retrievers.opendma --cov=llama_index.tools.opendma --cov-report=term-missing"
markers = [
    "integration: tests requiring an external OpenDMA tutorial repository and an Alfresco deployment",
]

[tool.coverage.run]
source = [
    "packages/llama-index-readers-opendma/src/llama_index/readers/opendma",
    "packages/llama-index-retrievers-opendma/src/llama_index/retrievers/opendma",
    "packages/llama-index-tools-opendma/src/llama_index/tools/opendma",
]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
